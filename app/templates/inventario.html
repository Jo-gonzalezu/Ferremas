<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferretería Ferremas - Inventario</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="body-class">
    
    {% extends "barra_superior.html" %}

    {% block content %}
    <div class="container mt-4">
        <h2>📦 Inventario de Productos</h2>
        <div class="row row-cols-1 row-cols-md-3 g-4">
            {% for producto in data.productos %}
            <div class="col">
                <div class="card h-100">
                    <img src="{{ producto.imagen }}" class="card-img-top" alt="{{ producto.nombre }}" style="height: 200px; object-fit: contain;">
                    <div class="card-body">
                        <h5 class="card-title">{{ producto.nombre }}</h5>
                        <p class="card-text">{{ producto.descripcion }}</p>
                        <p><strong>Categoría:</strong> {{ producto.categoria }}</p>
                        <p><strong>Precio:</strong> ${{ producto.precio }}</p>
                        <p><strong>Stock:</strong> <span id="stock-{{ producto.id }}">{{ producto.stock }}</span></p>
                        
                        <!-- 🌸 Botón agregar stock uwu -->
                        <button class="btn btn-sm btn-success w-100 mt-2" onclick="agregarStock({{ producto.id }})">➕ Agregar Stock</button>
                        
                        <!-- 🌸 Botón eliminar producto uwu -->
                        <button class="btn btn-sm btn-danger w-100 mt-2" onclick="eliminarProducto({{ producto.id }})">🗑️ Eliminar Producto</button>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
    {% endblock %}
    

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
