<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferretería El Martillo 🔨</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="body-class bg-light">
    <!-- Barra superior -->
    <nav class="navbar navbar-expand-lg" style="background-color: #2a006f; color: white; padding: 10px 20px;">
        <div class="container-fluid">
            <a class="navbar-brand text-white fw-bold fs-4" href="/home">🔩 FerreMas Digital</a>
            <form class="d-flex mx-auto" style="flex-grow: 1; max-width: 600px;">
                <input class="form-control me-2" type="search" placeholder="Busca productos" aria-label="Buscar">
                <button class="btn btn-light" type="submit" style="color: #2a006f;">🔍</button>
            </form>
            <div>
                <table>
                    <tr>
                        <td>
                            <svg stroke="currentColor" fill="none" viewBox="0 0 32 32" height="32" width="32" xmlns="http://www.w3.org/2000/svg">
                                <path d="M25.6595 26.5589C25.0897 24.9642 23.8343 23.555 22.0878 22.5499C20.3414 21.5449 18.2016 21.0001 16.0002 21.0001C13.7989 21.0001 11.659 21.5449 9.9126 22.5499C8.16616 23.555 6.91071 24.9642 6.34096 26.5589" stroke="var(--white)" stroke-width="2" stroke-linecap="round">
                                </path>
                                    <ellipse cx="15.9998" cy="11.0001" rx="5" ry="5" stroke="var(--white)" stroke-width="2" stroke-linecap="round"></ellipse>
                            </svg>
                        </td>
                        <td>
                            <div>
                                <p class="m-0">
                                    Hola {{ data.usuario['nombre'] }}!
                                </p>
                            </div>
                        </td>
                        <td>
                            <a href="#" class="text-white d-flex align-items-center" style="text-decoration: none;" onclick="mostrarCarrito()">
                                🛒 <span id="cart-count" class="badge bg-light text-dark ms-1">0</span>
                            </a>
                        </td>
                    </tr>
                </table>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <h2>Productos destacados 🛒</h2>
        <div class="row row-cols-1 row-cols-md-3 g-4" id="productos-lista"></div>
    </div>

    <!-- 🌸 Overlay y carrito lateral -->
    <div id="cart-overlay" onclick="ocultarCarrito()"></div>
    <div id="cart-sidebar">
        <h4>Tu carrito 🛒</h4>
        <ul id="cart-items" class="list-group"></ul>
        <h5 class="mt-3">Total: $<span id="cart-total">0</span></h5>
        <button class="btn btn-primary w-100 mt-3" onclick="confirmarCompra()">Iniciar pago 💳</button>
        <button onclick="reiniciarCarrito()" class="btn btn-danger w-100 mt-3">Vaciar carrito 🗑️</button>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
