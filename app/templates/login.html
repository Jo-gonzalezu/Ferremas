<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio sesión</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="body-login-class">
    <div class="div-container">
        <div class="div-login wrap-login100">
            <form id="login-form" action="/login" method="POST">
                <span class="login100-form-title p-b-53" style="margin: 25px 0px;padding-bottom:10px;font-size:1.75rem;">
                    Iniciar sesión
                </span>
                
                <br>

                <label for="email">Correo electrónico</label><br>
                <input type="email" id="email" name="email" required><br>
                
                <label for="password">Contraseña</label><br>
                <input type="password" id="password" name="password" required><br>
                
                <button type="submit">Entrar</button>
            </form>

            <!-- 🌸 Mensaje y botón de invitado  -->
            <div style="margin-top: 20px; text-align: center;">
                <p>¿No tienes cuenta?</p>
                <form action="/invitado" method="POST">
                    <button type="submit" class="btn btn-secondary w-100">Entrar como invitado</button>
                </form>
            </div>
        </div>
    </div>

    
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
