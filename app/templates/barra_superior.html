<body class="body-class">
    <!-- Navbar  -->
    <nav class="navbar navbar-expand-lg" style="background-color: #f8670d; color: white; padding: 10px 20px;">
        <div class="container-fluid d-flex justify-content-between align-items-center div-navbar">
            <a class="boton-panel-lateral">
                {% if data.es_admin %}
                <button id="open-left-panel" class="btn" style="background-color: #fdba37;">☰</button>
                {% endif %}
            </a>
            <a class="navbar-brand text-white fw-bold fs-4" href="/inicio">FERREMAS</a>
            <form id="buscador-form" class="d-flex mx-auto" style="flex-grow: 1; max-width: 600px;">
                <input class="form-control me-2" type="search" id="busqueda" placeholder="Busca productos" aria-label="Buscar">
                <button class="btn btn-light" type="submit" style="color: #2a006f;">🔍</button>
            </form>
            <div class="d-flex align-items-center">
                {% if data.usuario['tipo_usuario'] != 'invitado' %}
                    <p class="m-0 me-3">Hola {{ data.usuario['nombre'] }}!</p>
                    <a href="#" onclick="mostrarCarrito()" class="text-white d-flex align-items-center" style="text-decoration: none;">
                        🛒 <span id="cart-count" class="badge bg-light text-dark ms-1">0</span>
                    </a>
                {% else %}
                    <a href="/" class="login-box" style="text-decoration: none;">
                        <svg xmlns="http://www.w3.org/2000/svg" height="32" width="32" viewBox="0 0 32 32" fill="white">
                            <path d="M16 2a7 7 0 1 0 0 14 7 7 0 0 0 0-14zm0 16c-6 0-11 3-11 6v4h22v-4c0-3-5-6-11-6z"/>
                        </svg>
                        <div style="color: white;">
                            <p style="margin: 0;">Hola!</p>
                            <p style="margin: 0;">Inicia sesión</p>
                        </div>
                    </a>
                    <a href="#" onclick="mostrarCarrito()" class="text-white d-flex align-items-center" style="text-decoration: none;">
                        🛒 <span id="cart-count" class="badge bg-light text-dark ms-1">0</span>
                    </a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Panel lateral izquierdo  -->
    <div id="left-sidebar">
        <h4>Módulos 🌟</h4>
        <ul class="list-group">
            <li class="list-group-item"><a href="/inicio">🏠 Inicio</a></li>
            <li class="list-group-item"><a href="/inventario">📦 Inventario</a></li>
        </ul>
    </div>

    <!-- Bloque de contenido principal  -->
    <div id="main-content">
        {% block content %}{% endblock %}
    </div>

    <!-- Carrito lateral y overlay  -->
    <div id="cart-overlay" onclick="ocultarCarrito()"></div>
    <div id="cart-sidebar">
        <h4>Tu carrito 🛒</h4>
        <ul id="cart-items" class="list-group"></ul>
        <h5 class="mt-3">Total: $<span id="cart-total">0</span></h5>
        <button class="btn btn-primary w-100 mt-3" onclick="confirmarCompra()">Iniciar pago 💳</button>
        <button onclick="reiniciarCarrito()" class="btn btn-danger w-100 mt-3">Vaciar carrito 🗑️</button>
    </div>

    <!-- Scripts  -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
