<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferretería Ferremas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="body-class">
    {% extends "barra_superior.html" %}

    {% block title %}Inicio{% endblock %}

    {% block content %}
    
    <div class="div-banner">
        <img src="static/img/banner.png" alt="Logo" style="">
    </div>

    <!-- Sección de productos -->
    <section class="productos container">
        <h2>PRODUCTOS</h2>
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-4" id="productos-lista">
        </div>
    </section>
    
    <br>
    {% endblock %}

    <!-- 🌸 Overlay y carrito lateral -->
    <div id="cart-overlay" onclick="ocultarCarrito()"></div>
    <div id="cart-sidebar">
        <h4>Tu carrito 🛒</h4>
        <ul id="cart-items" class="list-group"></ul>
        <h5 class="mt-3">Total: $<span id="cart-total">0</span></h5>
        <button class="btn btn-primary w-100 mt-3" onclick="confirmarCompra()">Iniciar pago 💳</button>
        <button onclick="reiniciarCarrito()" class="btn btn-danger w-100 mt-3">Vaciar carrito 🗑️</button>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
